name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q LinkDownloader.zip
      - run: echo "android.useAndroidX=true" > LinkDownloader/gradle.properties
      - run: cd LinkDownloader && gradle assembleDebug
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" LinkDownloader/app/build/outputs/apk/debug/app-debug.apk --title "APK v${{ github.run_number }}" --notes "Link Downloader"
